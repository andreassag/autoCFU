[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "autocfu"
version = "0.1.0"
description = "AutoCFU: High-resolution sliced inference engine for microbial colony detection and counting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Andreas Sagen", email = "30706568+andreassag@users.noreply.github.com"}
]
dependencies = [
    "numpy>=1.20.0",
    "onnxruntime>=1.14.0",
    "pillow>=9.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pre-commit>=3.0.0",
    "ruff>=0.1.0",
    "ty>=0.0.1a1",
]
docs = [
    "sphinx>=7.0.0",
    "furo>=2024.1.0",
    "sphinx-autodoc-typehints>=1.25.0",
]

[project.scripts]
autocfu = "autocfu.cli:main"
autocfu-infer = "autocfu.cli:main"
agar-infer = "autocfu.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ty.environment]
python-version = "3.10"
