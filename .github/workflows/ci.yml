name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "notebooks/**"
      - "**/*.md"
      - "*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "licenses/**"
      - ".gitignore"
      - ".gitattributes"
      - ".pre-commit-config.yaml"
      - "models/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "notebooks/**"
      - "**/*.md"
      - "*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "licenses/**"
      - ".gitignore"
      - ".gitattributes"
      - ".pre-commit-config.yaml"
      - "models/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install package and dependencies
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv pip install --system -e ".[dev,docs]"
          else
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev,docs]"
          fi

      - name: Check code formatting (ruff)
        run: |
          ruff format --check src/ tests/

      - name: Lint codebase (ruff)
        run: |
          ruff check src/ tests/

      - name: Type-check codebase (ty)
        run: |
          ty check src/ tests/

      - name: Run unit tests (pytest)
        run: |
          pytest tests/

      - name: Build Sphinx documentation
        run: |
          sphinx-build -b html -W docs docs/_build/html

  dependabot-automerge:
    name: Dependabot Auto-Merge (Post-CI)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge Dependabot PR after successful tests
        run: |
          gh pr review --approve "$PR_URL" || true
          gh pr merge --merge "$PR_URL" || gh pr merge --squash "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
