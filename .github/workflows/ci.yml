name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "licenses/**"
      - ".gitignore"
      - ".gitattributes"
      - ".pre-commit-config.yaml"
      - "models/**"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "licenses/**"
      - ".gitignore"
      - ".gitattributes"
      - ".pre-commit-config.yaml"
      - "models/**"

permissions:
  contents: read

jobs:
  test:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,docs]"

      - name: Verify formatting
        run: ruff format --check src/ tests/

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Run ty static type checker
        run: ty check src/ tests/

      - name: Run pytest suite
        run: pytest tests/ -v

      - name: Build Sphinx documentation
        run: sphinx-build -b html -W docs docs/_build/html

  rust:
    name: Rust (fmt, clippy, test, doc)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy with warnings denied
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust test suite
        run: cargo test --all-targets

      - name: Build Rust crate documentation
        run: cargo doc --no-deps

  dependabot-automerge:
    name: Auto-merge Dependabot PR
    needs: [test, rust]
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --merge || \
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
