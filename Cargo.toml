[package]
name = "autocfu"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Standalone ONNX inference engine for Petri dish colony detection (CenterNet), instance segmentation (2D StarDist), and countability classification."
readme = "README.md"

[lib]
name = "autocfu"
path = "rust/src/lib.rs"

[[bin]]
name = "autocfu"
path = "rust/src/main.rs"

[features]
default = []
cuda = ["ort/cuda"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
ndarray = "0.17"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-31"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tiff = "0.11"
