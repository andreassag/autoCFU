# AutoCFU Default Inference Configuration
# Supports Radial CenterNet, 2D StarDist (32-ray), and Plate/Section Countability models.

slicing:
  slice_width: 640
  slice_height: 640
  overlap_width_ratio: 0.20
  overlap_height_ratio: 0.20

inference:
  # Model selection: "auto" (inspect ONNX outputs), "centernet", "stardist", or "countability"
  model_type: "auto"
  input_size: 640
  device: "auto"

  # Colony detection & segmentation parameters (CenterNet & StarDist)
  confidence_threshold: 0.35
  postprocess_match_threshold: 0.50
  merger_type: "greedy_nmm"
  match_metric: "center_dist"
  intra_tile_nms_threshold: 0.45
  min_radius: 1.5
  max_radius: 250.0
  min_box_size: 3.0
  max_box_size: 500.0
  max_aspect_ratio: 4.0
  target_class_id: 0
  class_name: "colony"
  top_k: 300
  num_rays: 32

  # Plate & section countability parameters (Countability classifier)
  countability_scope: "both"
  uncountable_threshold: 0.50
