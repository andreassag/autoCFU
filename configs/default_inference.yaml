# Default inference configuration for AutoCFU colony detection
# Used by autocfu and autocfu-infer CLI

# Slicing parameters for high-resolution agar dishes (e.g., 4000x4000 pixels)
slicing:
  slice_width: 640
  slice_height: 640
  overlap_width_ratio: 0.20
  overlap_height_ratio: 0.20

# Post-processing and inference thresholds
inference:
  confidence_threshold: 0.35
  postprocess_match_threshold: 0.50
  merger_type: "greedy_nmm" # Options: "greedy_nmm", "nms"
  match_metric: "ios" # Options: "iou", "ios"
  intra_tile_nms_threshold: 0.45 # Intra-tile query duplicate suppression (0.0 disables)
  intra_tile_match_metric: "ios" # Metric for intra-tile suppression: "iou" or "ios"
  target_class_id: 0
  class_name: "colony"
